[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orch"
version = "0.1.0"
description = "Оркестратор разработки: опрос → план → тесты до кода → параллельные воркеры в git worktree"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/sowaaaaa/orcha"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orch = "orch.cli:main"

[tool.setuptools]
packages = ["orch"]

[tool.setuptools.package-data]
orch = ["skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
